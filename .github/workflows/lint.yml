name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version-pinned installer components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = ["install.sh", "menu.sh", "core.sh"]
          versions = {}
          for name in paths:
              content = Path(name).read_text()
              match = re.search(r'^readonly SCRIPT_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$', content, re.MULTILINE)
              if not match:
                  raise SystemExit(f"{name} must declare SCRIPT_VERSION.")
              versions[name] = match.group(1)
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Installer/menu/core versions differ: {versions}")
          for name in ["install.sh", "menu.sh"]:
              content = Path(name).read_text()
              if 'readonly RELEASE_TAG="v${SCRIPT_VERSION}"' not in content:
                  raise SystemExit(f"{name} must resolve components through its immutable version tag.")
              if 'readonly RELEASE_BASE="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"' not in content:
                  raise SystemExit(f"{name} must build release URLs from its immutable version tag.")
              if '"${RELEASE_BASE}/SHA256SUMS"' not in content:
                  raise SystemExit(f"{name} must download the checksum manifest for its pinned release.")
              if "sha256sum --check --status" not in content:
                  raise SystemExit(f"{name} must verify checksums before running downloaded code.")
          print(f"Version-pinned installer components agree on v{versions['core.sh']}.")
          PY
      - name: Validate ACME staging runner isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          staging = Path("tests/staging/run-acme-staging.sh").read_text()
          required = [
              "--server letsencrypt_test",
              '--home "$STAGING_HOME"',
              '--config-home "$STAGING_HOME/config"',
              '--cert-home "$STAGING_HOME/certs"',
              'trap cleanup EXIT',
              'read -r -s Arvan_Token',
          ]
          for item in required:
              if item not in staging:
                  raise SystemExit(f"Staging test must include safety invariant: {item}")
          for forbidden in ["--install-cert", "/root/cert/", "/etc/ssl/acme/"]:
              if forbidden in staging:
                  raise SystemExit(f"Staging test must not install or replace production certificates: {forbidden}")
          print("ACME staging runner isolation checks passed.")
          PY
      - name: Validate release workflow safety
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/release.yml").read_text()
          lines = workflow.splitlines()
          assert not re.search(r"(?m)^  push:$", workflow), "Release publishing must not run on branch pushes."
          assert 'default: "v1.1.4"' in workflow, "Release input default should track the next candidate."
          assert '[[ "$GITHUB_REF" == "refs/heads/main" ]]' in workflow
          assert '[[ "$CONFIRMATION" == "PUBLISH" ]]' in workflow
          validate_index = lines.index("  validate:")
          publish_index = lines.index("  publish:")
          assert "      contents: read" in lines[validate_index:publish_index]
          assert "      contents: write" in lines[publish_index:]
          actions = re.findall(r"^\s+uses:\s+([^\s]+)", workflow, flags=re.MULTILINE)
          assert actions, "Expected at least one external action."
          assert all(re.fullmatch(r"[^@]+@[0-9a-f]{40}", action) for action in actions), actions
          assert "check_release_absent" in workflow, "Publisher must fail closed when the release/tag state cannot be verified."
          print("Release workflow syntax and safety invariants passed.")
          PY
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n menu.sh
          bash -n core.sh
          sh -n src/dns_arvan.sh
          bash -n tests/staging/run-acme-staging.sh
      - name: Smoke test CLI help
        run: |
          bash install.sh --help >/dev/null
          bash core.sh --help >/dev/null
      - name: Verify embedded ArvanCloud DNS plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core.sh").read_text()
          source = Path("src/dns_arvan.sh").read_text()
          marker = '  install -m 700 /dev/stdin "$DNSAPI_PATH" <<' + chr(39) + 'PLUGIN' + chr(39) + chr(10)
          if core.count(marker) != 1:
              raise SystemExit("Expected exactly one embedded DNS plugin block.")
          embedded = core.split(marker, 1)[1].split("\nPLUGIN\n", 1)[0]
          if embedded.strip() != source.strip():
              raise SystemExit("Embedded DNS plugin differs from src/dns_arvan.sh.")
          print("Embedded DNS plugin parity passed.")
          PY
      - name: Check default certificate output path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core.sh").read_text()
          menu = Path("menu.sh").read_text()
          entry = Path("install.sh").read_text()
          assert 'INSTALL_DIR="${INSTALL_DIR:-/root/cert/${DOMAIN}}"' in core
          assert 'Certificate files are available at:' in core
          assert 'Certificate output directory [/root/cert/${domain}]' in menu
          assert '"/root/cert/${DOMAIN}/fullchain.pem" "/etc/ssl/acme/${DOMAIN}/fullchain.pem"' in entry
          print("Default certificate path and user-facing path output checks passed.")
          PY
      - name: Install test and shell tooling
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes bats jq shellcheck
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Lint GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color
      - name: Run Bats behavioral tests
        run: bats tests/dns_arvan.bats tests/core_auth_validation.bats tests/core_auth_cleanup_signals.bats tests/core_replacement_key.bats tests/core_issuance_recovery.bats tests/core_worker.bats tests/installer_checksum.bats
      - name: Run ShellCheck
        run: shellcheck install.sh menu.sh core.sh src/dns_arvan.sh tests/staging/run-acme-staging.sh
