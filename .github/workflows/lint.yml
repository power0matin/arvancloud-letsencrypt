name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release workflow safety
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/release.yml").read_text()
          assert "\\n  push:" not in workflow, "Release publishing must not run on branch pushes."
          assert 'default: "v1.1.4"' in workflow, "Release input default should track the next candidate."
          assert '[[ "$GITHUB_REF" == "refs/heads/main" ]]' in workflow
          assert '[[ "$CONFIRMATION" == "PUBLISH" ]]' in workflow
          assert "  validate:\\n" in workflow and "  publish:\\n" in workflow
          assert "    permissions:\\n      contents: read" in workflow
          assert "    permissions:\\n      contents: write" in workflow
          actions = re.findall(r"^\\s+uses:\\s+([^\\s]+)", workflow, flags=re.MULTILINE)
          assert actions, "Expected at least one external action."
          assert all(re.fullmatch(r"[^@]+@[0-9a-f]{40}", action) for action in actions), actions
          print("Release workflow syntax and safety invariants passed.")
          PY
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n menu.sh
          bash -n core.sh
          sh -n src/dns_arvan.sh
      - name: Smoke test CLI help
        run: |
          bash install.sh --help >/dev/null
          bash core.sh --help >/dev/null
      - name: Verify embedded ArvanCloud DNS plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core.sh").read_text()
          source = Path("src/dns_arvan.sh").read_text()
          marker = '  install -m 700 /dev/stdin "$DNSAPI_PATH" <<' + chr(39) + 'PLUGIN' + chr(39) + chr(10)
          if core.count(marker) != 1:
              raise SystemExit("Expected exactly one embedded DNS plugin block.")
          embedded = core.split(marker, 1)[1].split("\nPLUGIN\n", 1)[0]
          if embedded.strip() != source.strip():
              raise SystemExit("Embedded DNS plugin differs from src/dns_arvan.sh.")
          print("Embedded DNS plugin parity passed.")
          PY
      - name: Check default certificate output path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core.sh").read_text()
          menu = Path("menu.sh").read_text()
          entry = Path("install.sh").read_text()
          assert 'INSTALL_DIR="${INSTALL_DIR:-/root/cert/${DOMAIN}}"' in core
          assert 'Certificate files are available at:' in core
          assert 'Certificate output directory [/root/cert/${domain}]' in menu
          assert '"/root/cert/${DOMAIN}/fullchain.pem" "/etc/ssl/acme/${DOMAIN}/fullchain.pem"' in entry
          print("Default certificate path and user-facing path output checks passed.")
          PY
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run ShellCheck
        run: shellcheck install.sh menu.sh core.sh src/dns_arvan.sh
