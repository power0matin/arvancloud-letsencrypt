name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.1.2)"
        required: true
        default: "v1.1.2"
        type: string
      confirmation:
        description: "Type PUBLISH to confirm creating a public release"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "PUBLISH"

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell syntax and CLI entrypoints
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n menu.sh
          bash -n core.sh
          sh -n src/dns_arvan.sh
          bash install.sh --help >/dev/null
          bash core.sh --help >/dev/null
          shellcheck install.sh menu.sh core.sh src/dns_arvan.sh

      - name: Verify embedded DNS plugin and scan release files
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core.sh").read_text()
          source = Path("src/dns_arvan.sh").read_text()
          marker = '  install -m 700 /dev/stdin "$DNSAPI_PATH" <<\'PLUGIN\'\n'
          if core.count(marker) != 1:
              raise SystemExit("Expected exactly one embedded DNS plugin block.")
          embedded = core.split(marker, 1)[1].split("\nPLUGIN\n", 1)[0]
          if embedded.strip() != source.strip():
              raise SystemExit("Embedded DNS plugin differs from src/dns_arvan.sh.")

          forbidden = [
              "hyper" + "sentry" + ".top",
              "arvan" + "-domains.json",
          ]
          ignored_parts = {".git"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue
              try:
                  body = path.read_text(errors="ignore")
              except OSError:
                  continue
              for needle in forbidden:
                  if needle in body:
                      raise SystemExit(f"Public release file contains a private identifier: {path}")
          print("Embedded plugin and public-file scan passed.")
          PY

      - name: Validate request, changelog, and repository visibility
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v1.1.2' }}
          CONFIRMATION: ${{ inputs.confirmation || 'PUBLISH' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          [[ "$CONFIRMATION" == "PUBLISH" ]] || {
            echo "Release cancelled: confirmation was not PUBLISH." >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }

          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          [[ "$visibility" == "public" ]] || {
            echo "Repository must be public before a public release can be created." >&2
            exit 1
          }

          version="${RELEASE_TAG#v}"
          header="## [${version}]"
          notes="$(awk -v header="$header" '
            index($0, header) == 1 && substr($0, length(header) + 1, 3) == " - " {
              found = 1
              next
            }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"

          [[ -n "${notes//[[:space:]]/}" ]] || {
            echo "No matching version section found in CHANGELOG.md for $RELEASE_TAG." >&2
            exit 1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            printf '%s\n\n' "ArvanCloud Let's Encrypt"
            printf '%s\n' "$notes"
          } > "$RUNNER_TEMP/release-notes.md"
          echo "Release validation passed for $RELEASE_TAG."

      - name: Generate SHA-256 manifest
        run: |
          set -Eeuo pipefail
          sha256sum install.sh menu.sh core.sh src/dns_arvan.sh > "$RUNNER_TEMP/SHA256SUMS"

      - name: Create public release
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v1.1.2' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/SHA256SUMS"

      - name: Update latest installation channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/latest" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "The latest installation channel now points to $GITHUB_SHA."
